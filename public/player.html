<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧本杀 — 游戏大厅</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <header class="app-header">
    <h1>剧本杀</h1>
    <span class="user-info" id="userInfo"></span>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">退出</button>
  </header>

  <div class="main-content" id="mainContent">
    <!-- 大厅视图 -->
    <div id="lobbyView" class="stagger">
      <div class="grid-2">
        <!-- 创建房间 -->
        <div class="panel">
          <h3>创建房间</h3>
          <div class="form-group">
            <label>选择剧本</label>
            <select id="createScriptSelect" class="form-select" onchange="onScriptSelect()">
              <option value="">-- 选择一个剧本 --</option>
            </select>
          </div>
          <div id="scriptPreview" style="display:none;"></div>
          <div class="form-group">
            <label>游玩人数（由剧本角色数决定）</label>
            <input type="number" id="createMaxPlayers" value="6" disabled
              class="form-input" style="opacity:0.6;" />
          </div>
          <button class="btn btn-success" onclick="createMyRoom()" id="btnCreateRoom" disabled>
            请先选择剧本
          </button>
          <div id="createResult" style="margin-top:12px;display:none;"></div>
        </div>

        <!-- 加入房间 -->
        <div class="panel">
          <h3>加入房间</h3>
          <p class="text-sm text-dim mb">输入朋友分享的房间码即可加入</p>
          <div class="form-inline">
            <input type="text" id="roomCodeInput" class="form-input form-input-code flex-1"
              placeholder="输入房间码" maxlength="6" />
            <button class="btn btn-primary btn-auto" onclick="joinRoom()">加入</button>
          </div>
        </div>
      </div>

      <!-- 可加入的房间 -->
      <div class="panel">
        <h3>可加入的房间</h3>
        <div class="grid-3" id="roomList">
          <div class="state-loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- 游戏视图 -->
    <div id="gameView" style="display:none;">
      <div id="gameContent"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/player.js"></script>
</body>
</html>
