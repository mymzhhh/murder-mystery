<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧本杀 — 管理端</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <header class="app-header">
    <h1>剧本杀管理端</h1>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchPage('scripts')">剧本管理</button>
      <button class="nav-tab" onclick="switchPage('users')">用户管理</button>
      <button class="nav-tab" onclick="switchPage('rooms')">房间管理</button>
    </div>
    <span class="user-info" id="userInfo"></span>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">退出</button>
  </header>

  <div class="main-content">

    <!-- 剧本管理 -->
    <div id="page-scripts" class="page active">
      <!-- 流水线生成 -->
      <div class="panel">
        <h3>剧本生成流水线</h3>
        <div class="pipeline-steps" id="pipelineSteps">
          <div class="pipe-step" id="ps1"><span class="pipe-num">1</span> 输入需求</div>
          <div class="pipe-arrow">→</div>
          <div class="pipe-step" id="ps2"><span class="pipe-num">2</span> 提示词优化</div>
          <div class="pipe-arrow">→</div>
          <div class="pipe-step" id="ps3"><span class="pipe-num">3</span> 生成剧本</div>
          <div class="pipe-arrow">→</div>
          <div class="pipe-step" id="ps4"><span class="pipe-num">4</span> 评测</div>
          <div class="pipe-arrow">→</div>
          <div class="pipe-step" id="ps5"><span class="pipe-num">5</span> 切分完成</div>
        </div>
        <div id="pipelineContent"></div>
      </div>

      <div class="panel">
        <h3>剧本库</h3>
        <table class="table" id="scriptTable">
          <thead><tr><th>主题</th><th>人数</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody><tr><td colspan="4" style="color:var(--text2);">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 用户管理 -->
    <div id="page-users" class="page">
      <div class="panel">
        <h3>用户列表</h3>
        <table class="table" id="userTable">
          <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody><tr><td colspan="4" style="color:var(--text2);">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 房间管理 -->
    <div id="page-rooms" class="page">
      <div class="grid-2">
        <div class="panel">
          <h3>创建房间</h3>
          <div class="form-group">
            <label>选择剧本</label>
            <select id="roomScriptSelect" style="width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;">
              <option value="">-- 选择剧本 --</option>
            </select>
          </div>
          <div class="form-group">
            <label>最大玩家数</label>
            <input type="number" id="roomMaxPlayers" value="6" min="3" max="8" style="width:100%;" />
          </div>
          <button class="btn btn-success" onclick="createRoom()">创建房间</button>
          <div id="roomCreated" style="margin-top:12px;display:none;"></div>
        </div>

        <div class="panel">
          <h3>活跃房间</h3>
          <div id="activeRooms"><span style="color:var(--text2);">加载中...</span></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const token = localStorage.getItem("token");
    const username = localStorage.getItem("username");
    const role = localStorage.getItem("role");

    if (!token || role !== "admin") { location.href = "/login.html"; }

    document.getElementById("userInfo").textContent = "管理员: " + username;

    function checkAuth(res) { if (res.status === 401) { localStorage.clear(); location.href = "/login.html"; } }

    function api(path, opts = {}) {
      return fetch(path, { headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, ...opts })
        .then(res => { checkAuth(res); return res; });
    }

    function switchPage(p) {
      document.querySelectorAll(".nav-tab").forEach((el, i) => {
        el.classList.toggle("active", el.textContent.includes(p === "scripts" ? "剧本" : p === "users" ? "用户" : "房间"));
      });
      document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
      document.getElementById("page-" + p).classList.add("active");
      if (p === "scripts") loadScripts();
      if (p === "users") loadUsers();
      if (p === "rooms") loadRooms();
    }

    async function doLogout() {
      await api("/api/auth/logout", { method: "POST" });
      localStorage.clear(); location.href = "/login.html";
    }

    // === 剧本 ===

    // 渲染流水线步骤
    function pipeActive(n) {
      for (var i = 1; i <= 5; i++) {
        var el = document.getElementById("ps" + i);
        el.classList.remove("active", "done", "error");
        if (i < n) el.classList.add("done");
        else if (i === n) el.classList.add("active");
      }
    }

    // 初始化流水线 UI
    function renderPipeline() {
      var h = '<div class="pipeline-content">';
      h += '<div class="form-group"><label>描述你想要的剧本</label>';
      h += '<textarea id="scriptInput" rows="4" placeholder="例如：民国上海滩富商毒杀案，6人参加。或者：两人PVE对抗本，现代都市背景..."></textarea></div>';
      h += '<div class="pipeline-buttons">';
      h += '<button class="btn btn-primary" onclick="step1Optimize()">优化提示词</button>';
      h += '</div></div>';
      document.getElementById("pipelineContent").innerHTML = h;
      pipeActive(1);
    }

    // Step 1: 优化提示词
    async function step1Optimize() {
      var input = document.getElementById("scriptInput").value.trim();
      if (!input) return alert("请输入剧本需求");

      pipeActive(2);
      var el = document.getElementById("pipelineContent");
      el.innerHTML = '<div class="progress-steps">Agent 正在分析和优化你的需求...</div>';

      try {
        var res = await api("/api/admin/pipeline/optimize", { method: "POST", body: JSON.stringify({ input: input }) });
        var data = await res.json();
        if (!res.ok) { el.innerHTML = '<span style="color:var(--danger);">' + esc(data.error || '失败') + '</span>'; pipeActive(1); return; }

        // 美化输出
        var playerCount = data.playerCount || (data.extracted ? data.extracted.playerCount : 4);
        var npcCount = data.npcCount || 0;
        var isPVE = data.isPVE !== undefined ? data.isPVE : (npcCount > 0);
        var gameMode = data.gameMode || (isPVE ? "PVE" : "PVP");

        // 存储配置供 step2 使用
        _scriptConfig = { playerCount: playerCount, npcCount: npcCount, isPVE: isPVE, gameMode: gameMode };

        el.innerHTML = '<div class="grid-2" style="margin-bottom:16px;">';
        el.innerHTML += '<div class="card" style="text-align:center;"><div style="font-size:32px;color:var(--gold);font-weight:800;">' + playerCount + '</div><div style="font-size:11px;color:var(--text-dim);">玩家角色</div></div>';
        el.innerHTML += '<div class="card" style="text-align:center;"><div style="font-size:32px;color:var(--mystic-light);font-weight:800;">' + npcCount + '</div><div style="font-size:11px;color:var(--text-dim);">NPC嫌疑人</div></div>';
        el.innerHTML += '<div class="card" style="text-align:center;"><div style="font-size:32px;color:' + (isPVE ? 'var(--gold)' : 'var(--mystic-light)') + ';font-weight:800;font-size:18px;">' + gameMode + '</div><div style="font-size:11px;color:var(--text-dim);">游戏模式</div></div>';
        if (data.title) el.innerHTML += '<div class="card"><strong style="color:var(--gold);">' + esc(data.title) + '</strong><div style="font-size:12px;color:var(--text-dim);margin-top:4px;">' + esc(data.era || '') + ' | ' + esc(data.style || '') + '</div></div>';
        el.innerHTML += '</div>';

        el.innerHTML += '<div class="form-group"><label>优化后的剧本需求（可修改）</label>';
        el.innerHTML += '<textarea id="optimizedInput" rows="6" style="font-family:var(--font);line-height:1.8;">' + esc(data.optimized || input) + '</textarea></div>';
        if (data.summary) el.innerHTML += '<div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">' + esc(data.summary) + '</div>';
        if (data.notes) el.innerHTML += '<div style="font-size:12px;color:var(--warning);margin-bottom:8px;">' + esc(data.notes) + '</div>';
        el.innerHTML += '<div class="pipeline-buttons">';
        el.innerHTML += '<button class="btn btn-outline" onclick="renderPipeline()">返回修改</button>';
        el.innerHTML += '<button class="btn btn-primary" onclick="step2Generate()">确认并生成</button>';
        el.innerHTML += '</div>';
      } catch (e) { el.innerHTML = '<span style="color:var(--danger);">优化失败: ' + e.message + '</span>'; pipeActive(1); }
    }

    // Step 2-5: 生成→评测→切分
    var _abortController = null;
    var _scriptConfig = null;
    var _lastSessionId = null;
    var _lastPhase = null;

    function cancelPipeline() {
      if (_abortController) { _abortController.abort(); _abortController = null; }
      pipeActive(1);
      renderPipeline();
    }

    // 从当前阶段重试（评测或切分）
    function retryPipeline(sessionId) {
      if (!sessionId) return;
      _lastSessionId = sessionId;
      var isReviewPhase = _lastPhase === 'review';
      pipeActive(isReviewPhase ? 4 : 5);
      var el = document.getElementById("pipelineContent");
      el.innerHTML = '<div class="progress-steps"></div>';
      el.innerHTML += '<div class="pipeline-buttons" style="margin-top:8px;"><button class="btn btn-danger btn-sm" onclick="cancelPipeline()">取消生成</button></div>';

      _abortController = new AbortController();
      var url = isReviewPhase
        ? "/api/admin/scripts/" + sessionId + "/review-revise"
        : "/api/admin/scripts/" + sessionId + "/split";

      fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        signal: _abortController.signal,
      }).then(async function(res) {
        var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
        while (true) {
          var rd = await reader.read(); if (rd.done) break;
          buf += dec.decode(rd.value, { stream: true });
          var lines = buf.split("\n"); buf = lines.pop() || ""; var et = "";
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("event: ")) et = lines[i].slice(7);
            else if (lines[i].startsWith("data: ")) {
              try {
                var d = JSON.parse(lines[i].slice(6));
                if (et === "progress") {
                  el.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;color:var(--text-dim);padding:2px 0;">' + esc(d.stage + ': ' + d.message) + '</div>';
                } else if (et === "complete") {
                  if (d.ok) {
                    pipeActive(5); el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--success);margin-top:8px;font-weight:600;">完成！</div>';
                  } else {
                    el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--warning);margin-top:8px;">' + esc(d.message || '未通过') + '</div>';
                  }
                  el.innerHTML += '<div class="pipeline-buttons"><button class="btn btn-primary" onclick="renderPipeline()">生成新剧本</button></div>';
                  loadScripts();
                } else if (et === "error") {
                  el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--danger);margin-top:8px;">' + esc(d.message) + '</div>';
                  if (_lastSessionId) {
                    el.innerHTML += '<div class="pipeline-buttons" style="margin-top:8px;"><button class="btn btn-primary" onclick="retryPipeline(\'' + _lastSessionId + '\')">再次重试</button>' +
                      '<button class="btn btn-outline" onclick="renderPipeline()" style="margin-left:4px;">重新开始</button></div>';
                  }
                }
              } catch (e) { /* skip */ }
            }
          }
        }
      }).catch(function(e) {
        if (e.name !== "AbortError") {
          el.innerHTML += '<div style="color:var(--danger);margin-top:8px;">重试失败: ' + e.message + '</div>';
          el.innerHTML += '<div class="pipeline-buttons"><button class="btn btn-primary" onclick="retryPipeline(\'' + sessionId + '\')">再次重试</button></div>';
        }
      }).finally(function() { _abortController = null; });
    }

    async function step2Generate() {
      var input = document.getElementById("optimizedInput").value.trim();
      if (!input) return alert("请输入剧本需求");

      pipeActive(3);
      var el = document.getElementById("pipelineContent");
      el.innerHTML = '<div class="progress-steps"></div>';
      el.innerHTML += '<div class="pipeline-buttons" style="margin-top:8px;"><button class="btn btn-danger btn-sm" onclick="cancelPipeline()">取消生成</button></div>';

      _abortController = new AbortController();
      var cancelled = false;

      try {
        var res = await fetch("/api/admin/pipeline/run", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ input: input, config: _scriptConfig || undefined }),
          signal: _abortController.signal,
        });
        var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
        while (true) {
          var rd = await reader.read(); if (rd.done) break;
          buf += dec.decode(rd.value, { stream: true });
          var lines = buf.split("\n"); buf = lines.pop() || ""; var et = "";
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("event: ")) et = lines[i].slice(7);
            else if (lines[i].startsWith("data: ")) {
              try {
                var d = JSON.parse(lines[i].slice(6));
                if (et === "progress") {
                  var color = "var(--text-dim)";
                  var icon = " ";
                  if (d.stage === "player_script") { color = "var(--mystic-light)"; icon = " "; }
                  else if (d.stage === "npc_script") { color = "var(--gold)"; icon = " "; }
                  else if (d.stage === "review_pass") { color = "var(--success)"; }
                  else if (d.stage === "review_fail") { color = "var(--danger)"; }
                  el.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;color:' + color + ';padding:2px 0;">' + icon + esc(d.stage + ': ' + d.message) + '</div>';
                } else if (et === "phase") {
                  if (d.phase === "write") pipeActive(3);
                  else if (d.phase === "review") pipeActive(4);
                  else if (d.phase === "split") pipeActive(5);
                  if (d.phase === "write_done" && d.sessionId) _lastSessionId = d.sessionId;
                  _lastPhase = d.phase;
                  el.querySelector(".progress-steps").innerHTML += '<div style="font-size:13px;color:var(--gold);padding:4px 0;font-weight:600;">' + esc(d.message) + '</div>';
                } else if (et === "complete") {
                  if (d.status === "done") {
                    pipeActive(5); el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--success);margin-top:8px;font-weight:600;">剧本生成完成！已评测通过并切分</div>';
                  } else {
                    el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--warning);margin-top:8px;">' + esc(d.message) + '</div>';
                  }
                  if (d.sessionId) el.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;margin-top:4px;">SessionId: ' + d.sessionId + '</div>';
                  el.innerHTML += '<div class="pipeline-buttons"><button class="btn btn-primary" onclick="renderPipeline()">生成新剧本</button></div>';
                  loadScripts();
                } else if (et === "error") {
                  el.querySelector(".progress-steps").innerHTML += '<div style="color:var(--danger);margin-top:8px;">' + esc(d.message) + '</div>';
                  var sid = d.sessionId || _lastSessionId;
                  if (sid) {
                    var btnLabel = (_lastPhase === 'review') ? '重试评测+切分' : (_lastPhase === 'write' || !_lastPhase ? '重新生成' : '重试切分');
                    el.innerHTML += '<div class="pipeline-buttons" style="margin-top:8px;"><button class="btn btn-primary" onclick="retryPipeline(\'' + sid + '\')">' + btnLabel + '</button>' +
                      '<button class="btn btn-outline" onclick="renderPipeline()" style="margin-left:4px;">重新开始</button></div>';
                  } else {
                    pipeActive(1);
                  }
                }
              } catch (e) { /* skip */ }
            }
          }
        }
      } catch (e) {
        if (e.name === "AbortError") {
          el.innerHTML = '<div style="color:var(--warning);padding:12px;">已取消生成</div>';
          el.innerHTML += '<div class="pipeline-buttons"><button class="btn btn-primary" onclick="renderPipeline()">重新开始</button></div>';
        } else {
          el.innerHTML += '<span style="color:var(--danger);">流水线失败: ' + e.message + '</span>';
        }
        pipeActive(1);
      } finally { _abortController = null; }
    }

    async function loadScripts() {
      try {
        const res = await api("/api/admin/scripts");
        const data = await res.json();
        const tbody = document.querySelector("#scriptTable tbody");
        if (data.scripts.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text2);">暂无剧本</td></tr>'; return; }
        tbody.innerHTML = data.scripts.map(s => `
          <tr>
            <td>${esc(s.topic)}</td>
            <td>${s.characterCount || '?'}人</td>
            <td>${new Date(s.createdAt).toLocaleString()}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="createRoomFromScript('${s.sessionId}')">创建房间</button>
              <button class="btn btn-outline btn-sm" onclick="viewScript('${s.sessionId}')" style="margin-left:4px;">查看原文</button>
              ${s.isSplit ? '<button class="btn btn-outline btn-sm" onclick="viewSplitData(\'' + s.sessionId + '\')" style="margin-left:4px;">查看切分</button>' : ''}
              <button class="btn btn-outline btn-sm" onclick="reviewScript('${s.sessionId}')" style="margin-left:4px;">评测</button>
              <button class="btn btn-outline btn-sm" onclick="reviewAndReviseScript('${s.sessionId}')" style="margin-left:4px;">评测+修复</button>
              <button class="btn btn-outline btn-sm" onclick="splitScriptBtn('${s.sessionId}')" style="margin-left:4px;">切分</button>
              <button class="btn btn-outline btn-sm" onclick="deleteScript('${s.sessionId}')" style="margin-left:4px;">删除</button>
            </td>
          </tr>`).join("");
        // 填充房间创建下拉框
        const sel = document.getElementById("roomScriptSelect");
        sel.innerHTML = '<option value="">-- 选择剧本 --</option>' + data.scripts.map(s => `<option value="${s.sessionId}">${esc(s.topic.substring(0,40))}</option>`).join("");
        // 请求列表
        loadRequests();
      } catch (e) { /* ignore */ }
    }

    async function generateScript() {
      const input = document.getElementById("scriptInput").value.trim();
      if (!input) return alert("请输入剧本需求");

      document.getElementById("btnGenerate").disabled = true;
      const prog = document.getElementById("genProgress");
      prog.style.display = "block";
      prog.innerHTML = '<div class="progress-steps"></div>';

      try {
        const res = await fetch("/api/admin/scripts/generate", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ input }),
        });
        const reader = res.body.getReader();
        const dec = new TextDecoder(); let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop() || "";
          let et = "";
          for (const l of lines) {
            if (l.startsWith("event: ")) et = l.slice(7);
            else if (l.startsWith("data: ")) {
              try {
                const d = JSON.parse(l.slice(6));
                if (et === "progress") {
                  var steps = prog.querySelector(".progress-steps");
                  if (steps) steps.innerHTML += '<div style="font-size:12px;color:var(--text2);padding:2px 0;">' + d.stage + ': ' + d.message + '</div>';
                } else if (et === "error") {
                  prog.innerHTML += '<div style="color:var(--danger);margin-top:8px;padding:8px;background:rgba(239,68,68,0.1);border-radius:8px;">' + esc(d.message || '生成失败') + '</div>';
                } else if (et === "complete") {
                  var sum = d.summary || {};
                  prog.querySelector(".progress-steps").innerHTML += '<div style="color:var(--success);margin-top:8px;">生成完成！</div>';
                  prog.querySelector(".progress-steps").innerHTML += '<div style="margin-top:8px;padding:8px;background:rgba(16,185,129,0.1);border-radius:8px;font-size:13px;">' +
                    '<div>剧本：《' + esc(sum.title || '') + '》</div>' +
                    '<div>角色数：' + (sum.characterCount || 0) + '人（' + (sum.characterNames || []).join('、') + '）</div>' +
                    '<div>时代：' + esc(sum.era || '') + ' | 线索：' + (sum.clueCount || 0) + '条</div>' +
                    '<div style="margin-top:4px;">SessionId: ' + d.sessionId + '</div>' +
                  '</div>';
                  loadScripts();
                }
              } catch (e) { /* skip */ }
            }
          }
        }
      } catch (e) { prog.innerHTML = `<span style="color:var(--danger);">生成失败: ${e.message}</span>`; }
      document.getElementById("btnGenerate").disabled = false;
    }

    var stageColor = function(stage) {
      if (stage.includes('player_script')) return 'var(--mystic-light)';
      if (stage.includes('npc_script')) return 'var(--gold)';
      if (stage.includes('clue')) return '#4ade80';
      if (stage.includes('dm') || stage.includes('save')) return '#93c5fd';
      if (stage.includes('passed') || stage.includes('done')) return 'var(--success)';
      if (stage.includes('fail') || stage.includes('revise')) return 'var(--warning)';
      return 'var(--text-dim)';
    };

    async function splitScriptBtn(id) {
      if (!confirm("切分将解析剧本并用AI纯化角色剧本和线索，可能需要数分钟。继续？")) return;
      var prog = document.getElementById("genProgress");
      prog.style.display = "block";
      prog.innerHTML = '<div class="progress-steps"></div>';
      try {
        var res = await fetch("/api/admin/scripts/" + id + "/split", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
        });
        var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
        while (true) {
          var rd = await reader.read(); if (rd.done) break;
          buf += dec.decode(rd.value, { stream: true });
          var lines = buf.split("\n"); buf = lines.pop() || ""; var et = "";
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("event: ")) et = lines[i].slice(7);
            else if (lines[i].startsWith("data: ")) {
              try {
                var d = JSON.parse(lines[i].slice(6));
                if (et === "progress") { prog.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;color:' + stageColor(d.stage) + ';padding:2px 0;">' + d.stage + ': ' + d.message + '</div>'; }
                else if (et === "complete") {
                  prog.querySelector(".progress-steps").innerHTML += '<div style="color:var(--success);margin-top:8px;font-weight:600;">✅ 切分完成！已入库</div>';
                  loadScripts();
                }
              } catch (e) { /* skip */ }
            }
          }
        }
      } catch (e) { prog.innerHTML += '<div style="color:var(--danger);margin-top:8px;">❌ 切分失败: ' + e.message + '</div>'; }
    }

    async function viewScript(id) {
      try {
        const res = await api("/api/admin/scripts/" + id);
        const data = await res.json();
        if (!data.markdown) return alert("剧本内容为空");
        const w = window.open("", "_blank", "width=800,height=700");
        w.document.write('<html><head><meta charset="utf-8"><title>剧本原文</title><style>body{font-family:serif;background:#1a1a2e;color:#d4d4dc;padding:20px;line-height:1.8;white-space:pre-wrap;}</style></head><body>' + esc(data.markdown) + '</body></html>');
      } catch(e) { alert("查看失败: " + e.message); }
    }

    async function viewSplitData(id) {
      try {
        const res = await api("/api/admin/scripts/" + id + "/split-view");
        const data = await res.json();
        if (!data.meta) return alert("切分数据不存在");
        var h = '<h2 style="color:var(--gold);">' + esc(data.meta.title) + '</h2>';
        h += '<p>' + esc(data.meta.era||'') + ' | ' + esc(data.meta.location||'') + ' | ' + data.characters.length + '角色 | ' + data.clues.length + '条线索</p><hr>';
        h += '<h3>角色剧本</h3>';
        data.characters.forEach(function(c) {
          h += '<details style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface);"><summary style="color:' + (c.roleType==="npc"?'var(--gold)':'var(--mystic-light)') + ';font-weight:600;">' + esc(c.name) + ' [' + (c.roleType==="npc"?'NPC':'玩家') + ']' + (c.isMurderer?' 🔪凶手':'') + ' — ' + esc(c.occupation||'') + '</summary><div style="white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:300px;overflow-y:auto;margin-top:8px;">' + esc(c.script||'') + '</div>' + (c.secret ? '<div style="margin-top:8px;color:var(--blood-light);"><strong>秘密:</strong> ' + esc(c.secret) + '</div>' : '') + '</details>';
        });
        h += '<h3>线索列表 (' + data.clues.length + '条)</h3>';
        data.clues.forEach(function(c) {
          h += '<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="color:var(--gold);">' + esc(c.id) + '</span> (R' + c.round + ') ' + esc(c.content||'') + '</div>';
        });
        var dm = data.dm || {};
        h += '<h3>DM手册</h3><p><strong>凶手:</strong> ' + esc(dm.murdererName||'') + ' | ' + esc(dm.murdererMotive||'') + '</p>';
        if (dm.truthReveal) h += '<div style="white-space:pre-wrap;">' + esc(dm.truthReveal) + '</div>';
        var w = window.open("", "_blank", "width=900,height=750");
        w.document.write('<html><head><meta charset="utf-8"><title>切分数据</title><style>body{font-family:sans-serif;background:#1a1a2e;color:#d4d4dc;padding:20px;line-height:1.6;} h2,h3{color:#c9a96e;} hr{border-color:#2a2a45;} details{background:#181830;} summary{cursor:pointer;}</style></head><body>' + h + '</body></html>');
      } catch(e) { alert("查看失败: " + e.message); }
    }

    async function deleteScript(id) {
      if (!confirm("确定删除？")) return;
      await api("/api/admin/scripts/" + id, { method: "DELETE" });
      loadScripts();
    }

    async function reviewScript(id) {
      var prog = document.getElementById("genProgress");
      prog.style.display = "block";
      prog.innerHTML = '<h4 style="color:var(--gold);margin-bottom:8px;">📊 剧本评测</h4><div class="progress-steps"><div style="color:var(--mystic-light);">⏳ AI 正在多维度评测中...</div></div>';
      try {
        var res = await api("/api/admin/scripts/" + id + "/review", { method: "POST" });
        var data = await res.json();
        if (!res.ok) { prog.innerHTML = '<span style="color:var(--danger);">' + esc(data.error || '评测失败') + '</span>'; return; }
        var scores = data.scores || {};
        var passed = data.passed;
        prog.querySelector(".progress-steps").innerHTML =
          '<div style="color:' + (passed ? 'var(--success)' : 'var(--warning)') + ';font-size:14px;font-weight:600;">' + (passed ? '✅ 评测通过' : '⚠️ 评测未通过') + ' — ' + data.totalScore + '分</div>' +
          '<div style="margin-top:12px;padding:12px;background:var(--surface);border-radius:8px;">' +
          '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;">' +
          '<div><div style="font-size:24px;color:var(--gold);">' + (scores.storyCompleteness||'-') + '</div><div style="font-size:10px;color:var(--text-dim);">故事</div></div>' +
          '<div><div style="font-size:24px;color:var(--blood-light);">' + (scores.murdererDesign||'-') + '</div><div style="font-size:10px;color:var(--text-dim);">凶手</div></div>' +
          '<div><div style="font-size:24px;color:#4ade80;">' + (scores.clueSystem||'-') + '</div><div style="font-size:10px;color:var(--text-dim);">线索</div></div>' +
          '<div><div style="font-size:24px;color:var(--mystic-light);">' + (scores.characterDesign||'-') + '</div><div style="font-size:10px;color:var(--text-dim);">角色</div></div>' +
          '<div><div style="font-size:24px;color:#fcd34d;">' + (scores.playability||'-') + '</div><div style="font-size:10px;color:var(--text-dim);">可玩性</div></div>' +
          '</div>' +
          (data.strengths && data.strengths.length ? '<div style="margin-top:8px;font-size:12px;color:var(--success);">👍 ' + esc(data.strengths.join('；')) + '</div>' : '') +
          (data.weaknesses && data.weaknesses.length ? '<div style="margin-top:4px;font-size:12px;color:var(--warning);">⚠️ ' + esc(data.weaknesses.join('；')) + '</div>' : '') +
          (data.revisionAdvice ? '<div style="margin-top:8px;padding:8px;background:var(--surface2);border-radius:6px;font-size:12px;color:var(--text);">💡 ' + esc(data.revisionAdvice) + '</div>' : '') +
          '</div>';
      } catch (e) { prog.innerHTML = '<span style="color:var(--danger);">评测失败: ' + e.message + '</span>'; }
    }

    async function reviewAndReviseScript(id) {
      if (!confirm("评测+修复将进行最多3轮评测和重新生成，每轮可能需要数分钟。确定继续？")) return;
      var prog = document.getElementById("genProgress");
      prog.style.display = "block";
      prog.innerHTML = '<h4 style="color:var(--gold);margin-bottom:8px;">🔄 评测+修复</h4><div class="progress-steps"></div>';
      try {
        var res = await fetch("/api/admin/scripts/" + id + "/review-revise", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
        });
        var reader = res.body.getReader();
        var dec = new TextDecoder(); var buf = "";
        while (true) {
          var r = await reader.read();
          if (r.done) break;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split("\n"); buf = lines.pop() || "";
          var et = "";
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("event: ")) et = lines[i].slice(7);
            else if (lines[i].startsWith("data: ")) {
              try {
                var d = JSON.parse(lines[i].slice(6));
                if (et === "progress") {
                  prog.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;color:' + stageColor(d.stage) + ';padding:2px 0;">' + d.stage + ': ' + d.message + '</div>';
                } else if (et === "complete") {
                  var result = d;
                  var pts = result.passed ? '✅ 通过！最终分数: ' + result.finalScore : '⚠️ ' + result.totalRounds + '轮后未通过，最终分数: ' + result.finalScore;
                  prog.querySelector(".progress-steps").innerHTML += '<div style="color:' + (result.passed ? 'var(--success)' : 'var(--warning)') + ';margin-top:8px;font-weight:600;">' + pts + '</div>';
                  if (result.rounds) {
                    result.rounds.forEach(function(r) {
                      prog.querySelector(".progress-steps").innerHTML += '<div style="font-size:11px;color:var(--text2);">第' + r.round + '轮: ' + r.totalScore + '分</div>';
                    });
                  }
                  if (result.sessionId) {
                    prog.querySelector(".progress-steps").innerHTML += '<div style="font-size:12px;margin-top:4px;">新剧本SessionId: ' + result.sessionId + '</div>';
                  }
                  loadScripts();
                }
              } catch (e) { /* skip */ }
            }
          }
        }
      } catch (e) { prog.innerHTML += '<span style="color:var(--danger);">评测修复失败: ' + e.message + '</span>'; }
    }

    async function loadRequests() {
      try {
        const r = await require("./modules/game-manager").getRedis();
        // ... requests stored in Redis
        document.getElementById("requestList").innerHTML = '<span style="color:var(--text2);">暂无待处理请求</span>';
      } catch (e) { /* ignore */ }
    }

    // === 用户 ===
    async function loadUsers() {
      try {
        const res = await api("/api/admin/users");
        const data = await res.json();
        document.querySelector("#userTable tbody").innerHTML = data.users.map(u => `
          <tr>
            <td>${esc(u.username)}</td>
            <td><span class="tag ${u.role==='admin'?'tag-admin':'tag-player'}">${u.role}</span></td>
            <td>${u.createdAt ? new Date(u.createdAt).toLocaleString() : ''}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="toggleRole('${esc(u.username)}','${u.role==='admin'?'player':'admin'}')">设为${u.role==='admin'?'玩家':'管理员'}</button>
              ${u.username !== username ? `<button class="btn btn-outline btn-sm" onclick="delUser('${esc(u.username)}')" style="margin-left:4px;">删除</button>` : ''}
            </td>
          </tr>`).join("");
      } catch (e) { /* ignore */ }
    }

    async function toggleRole(name, role) {
      await api("/api/admin/users/" + name + "/role", { method: "PUT", body: JSON.stringify({ role }) });
      loadUsers();
    }
    async function delUser(name) {
      if (!confirm("确定删除用户 " + name + "？")) return;
      await api("/api/admin/users/" + name, { method: "DELETE" });
      loadUsers();
    }

    // === 房间 ===
    async function loadRooms() {
      try {
        const res = await api("/api/admin/rooms");
        const data = await res.json();
        const el = document.getElementById("activeRooms");
        if (data.rooms.length === 0) { el.innerHTML = '<span style="color:var(--text2);">暂无活跃房间</span>'; return; }
        el.innerHTML = data.rooms.map(r => `
          <div class="card" style="margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <strong>${esc(r.scriptTitle||'未命名')}</strong>
                <span class="tag">${r.roomCode}</span>
                <span style="font-size:12px;color:var(--text2);">${r.playerCount}人 | ${r.phase}</span>
              </div>
              <button class="btn btn-outline btn-sm" onclick="closeRoom('${r.roomCode}')">关闭</button>
            </div>
          </div>`).join("");
      } catch (e) { /* ignore */ }
    }

    async function createRoom() {
      const sid = document.getElementById("roomScriptSelect").value;
      const max = document.getElementById("roomMaxPlayers").value;
      if (!sid) return alert("请选择剧本");
      try {
        const res = await api("/api/admin/rooms", { method: "POST", body: JSON.stringify({ scriptSessionId: sid, maxPlayers: max }) });
        const data = await res.json();
        const el = document.getElementById("roomCreated");
        el.style.display = "block";
        el.innerHTML = `<div style="padding:16px;background:var(--surface2);border-radius:8px;text-align:center;">
          <p>房间已创建</p>
          <div class="room-code-lg">${data.roomCode}</div>
          <p style="margin-top:8px;color:var(--text2);">${data.characterCount}个角色 | 分享房间码给玩家</p>
        </div>`;
        loadRooms();
      } catch (e) { alert("创建失败: " + e.message); }
    }

    function createRoomFromScript(sid) {
      document.getElementById("roomScriptSelect").value = sid;
      switchPage("rooms");
      document.getElementById("roomMaxPlayers").value = 6;
    }

    async function closeRoom(code) {
      if (!confirm("确定关闭房间 " + code + "？")) return;
      await api("/api/admin/rooms/" + code, { method: "DELETE" });
      loadRooms();
    }

    function esc(s) {
      const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML;
    }

    loadScripts();
    renderPipeline();
  </script>
</body>
