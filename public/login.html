<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧本杀平台 — 登录</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card stagger">
      <h1>剧本杀</h1>
      <p class="subtitle">AI DM 全自动推理游戏平台</p>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">登录</button>
        <button class="tab" onclick="switchTab('register')">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" autocomplete="off" onsubmit="return doLogin()">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUser" class="form-input" placeholder="请输入用户名" autocomplete="username" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPass" class="form-input" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" style="display:none;" autocomplete="off" onsubmit="return doRegister()">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUser" class="form-input" placeholder="至少2个字符" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPass" class="form-input" placeholder="至少4个字符" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regPass2" class="form-input" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
      </form>

      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    var mode = "login";

    function switchTab(t) {
      mode = t;
      document.querySelectorAll(".tab").forEach(function(el, i) {
        el.classList.toggle("active", (i === 0 && t === "login") || (i === 1 && t === "register"));
      });
      var loginForm = document.getElementById("loginForm");
      var registerForm = document.getElementById("registerForm");
      var errorEl = document.getElementById("errorMsg");

      if (t === "login") {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
        loginForm.style.animation = "fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)";
      } else {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
        registerForm.style.animation = "fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)";
      }
      errorEl.style.display = "none";
    }

    function showError(msg) {
      var el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }

    function setLoading(btnId, loading) {
      var btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.classList.add("btn-loading");
        btn.dataset.originalText = btn.textContent;
      } else {
        btn.disabled = false;
        btn.classList.remove("btn-loading");
        btn.textContent = btn.dataset.originalText || btn.textContent;
      }
    }

    function doLogin() {
      var u = document.getElementById("loginUser").value.trim();
      var p = document.getElementById("loginPass").value;
      if (!u || !p) { showError("请输入用户名和密码"); return false; }

      setLoading("loginBtn", true);
      fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p }),
      }).then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(r) {
          if (!r.ok) { showError(r.data.error); setLoading("loginBtn", false); return; }
          localStorage.setItem("token", r.data.token);
          localStorage.setItem("username", r.data.username);
          localStorage.setItem("role", r.data.role);
          location.href = r.data.role === "admin" ? "/admin.html" : "/player.html";
        })
        .catch(function() { showError("网络错误，请重试"); setLoading("loginBtn", false); });
      return false;
    }

    function doRegister() {
      var u = document.getElementById("regUser").value.trim();
      var p = document.getElementById("regPass").value;
      var p2 = document.getElementById("regPass2").value;
      if (!u || !p) { showError("请输入用户名和密码"); return false; }
      if (u.length < 2) { showError("用户名至少2个字符"); return false; }
      if (p.length < 4) { showError("密码至少4个字符"); return false; }
      if (p !== p2) { showError("两次密码不一致"); return false; }

      setLoading("registerBtn", true);
      fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p }),
      }).then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(r) {
          if (!r.ok) { showError(r.data.error); setLoading("registerBtn", false); return; }
          localStorage.setItem("token", r.data.token);
          localStorage.setItem("username", r.data.username);
          localStorage.setItem("role", r.data.role);
          location.href = "/player.html";
        })
        .catch(function() { showError("网络错误，请重试"); setLoading("registerBtn", false); });
      return false;
    }

    // 页面加载时清除旧的认证态（确保不会携带过期token）
    if (localStorage.getItem("token") && !location.search.includes("stay")) {
      // 不做自动跳转，用户可能需要重新登录
    }
  </script>
</body>
</html>
